<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Cofounder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <!-- Markdown rendering + XSS protection -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body>
  <!-- Mobile overlay -->
  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-mark">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L3 7v10l9 5 9-5V7l-9-5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M12 12L3 7m9 5l9-5m-9 5v10" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="logo-text">Cofounder</span>
      </div>
      <button id="new-chat-btn" class="new-chat-btn" title="New conversation">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </div>
    <div class="sidebar-section-label">Conversations</div>
    <ul id="session-list" class="session-list"></ul>
    <div class="sidebar-footer">
      <div class="user-badge">
        <span id="sidebar-user-avatar" class="user-avatar">F</span>
        <span id="sidebar-user-name" class="user-name">Founder</span>
      </div>
      <div class="sidebar-footer-meta">
        <span class="system-tag">SYS.v2.0</span>
        <span class="status-indicator"></span>
      </div>
    </div>
  </aside>

  <!-- Main area -->
  <main class="main">
    <!-- Top bar -->
    <header class="topbar">
      <button id="hamburger" class="hamburger" title="Toggle sidebar">
        <span></span><span></span><span></span>
      </button>
      <div class="topbar-left">
        <h1 class="topbar-title">Cofounder Intelligence</h1>
        <span class="topbar-badge">11 agents</span>
      </div>
      <div class="topbar-spacer"></div>
      <div class="user-select-wrapper">
        <select id="user-select" class="user-select">
          <option value="founder">Founder</option>
          <option value="cofounder">Co-founder</option>
        </select>
      </div>
    </header>

    <!-- Messages -->
    <div id="messages" class="messages">
      <!-- Empty state / Welcome -->
      <div id="welcome" class="welcome">
        <div class="welcome-brand" aria-hidden="true">
          <div class="welcome-logo-ring">
            <div class="welcome-logo-inner">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
                <path d="M12 2L3 7v10l9 5 9-5V7l-9-5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                <path d="M12 12L3 7m9 5l9-5m-9 5v10" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>
        </div>
        <h2 class="welcome-headline">AI Cofounder</h2>
        <p class="welcome-sub">Your multi-agent strategic advisor &mdash; 11 agents standing by for strategy, compliance, fundraising, GTM, and beyond.</p>
        <div class="suggested-prompts">
          <button class="suggested-prompt" data-prompt="What should our GTM strategy look like for our first customer segment?">
            <span class="prompt-label">GTM Strategy</span>
            <span class="prompt-detail">First customer segment</span>
          </button>
          <button class="suggested-prompt" data-prompt="Help me think through our pricing model">
            <span class="prompt-label">Pricing Model</span>
            <span class="prompt-detail">Pricing unit and first tests</span>
          </button>
          <button class="suggested-prompt" data-prompt="Help me prepare customer interview questions for my next call">
            <span class="prompt-label">Customer Interviews</span>
            <span class="prompt-detail">Discovery call preparation</span>
          </button>
          <button class="suggested-prompt" data-prompt="Analyze our current runway and suggest fundraising timing">
            <span class="prompt-label">Runway Analysis</span>
            <span class="prompt-detail">Fundraising timing & strategy</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Input area -->
    <div class="input-area">
      <div class="input-frame">
        <div class="input-container">
          <textarea
            id="message-input"
            placeholder="Ask your cofounder team anything..."
            rows="1"
          ></textarea>
          <button id="send-btn" class="send-btn" disabled title="Send (Ctrl+Enter)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </button>
        </div>
        <div class="input-hint">
          <span class="key-hint">Ctrl+Enter</span> to send
        </div>
      </div>
    </div>
  </main>

  <!-- Error toast -->
  <div id="error-toast" class="error-toast" hidden>
    <span id="error-toast-msg"></span>
    <button id="error-toast-retry" class="error-toast-retry" style="display:none">Retry</button>
    <button id="error-toast-close" class="error-toast-close">&times;</button>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
